plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

def minecraftVersion = project.minecraft_version
def loaderVersion = project.loader_version
def modVersion = project.version
def javaVersion = project.java_version

repositories {
	// Add repositories to retrieve artifacts from in here.
	// Loom adds the essential Maven repositories for Minecraft and libraries automatically.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"blockscanner" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", modVersion
	inputs.property "minecraft_version", minecraftVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion, "minecraft_version": minecraftVersion,
				"loader_version": loaderVersion, "java_version": javaVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(javaVersion)
}

java {
	// Loom attaches the sources jar to the remap sources and build tasks.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Configure artifact publication destinations here.
	}
}
